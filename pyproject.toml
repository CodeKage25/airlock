[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-airlock"
version = "0.2.0"
description = "The safety layer between your AI agent and the real world."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeKage25" }]
keywords = ["agents", "llm", "guardrails", "payments", "audit", "idempotency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.1"]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.2", "mypy>=2.3.0"]

[project.scripts]
airlock = "airlock.cli:main"

[project.urls]
Homepage = "https://github.com/CodeKage25/airlock"
Issues = "https://github.com/CodeKage25/airlock/issues"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "airlock.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
