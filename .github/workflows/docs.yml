name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deploying needs Pages set to "GitHub Actions" once, under Settings → Pages.
      # This step cannot do it for you: pages: write covers deploying to an existing
      # site, while creating one needs admin rights the default token does not carry,
      # so enablement: true only ever returns "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: stage the root markdown into the site
        run: python3 scripts/stage_docs.py
      - run: uv run --with mkdocs-material mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
